name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          mkdir -p bin
          # Build for AMD64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o bin/sp-caddy-manager_linux_amd64 .
          # Build for ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/sp-caddy-manager_linux_arm64 .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/sp-caddy-manager_linux_amd64
            bin/sp-caddy-manager_linux_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
