version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    ldflags: -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # Note: Linux amd64 and arm64 builds enabled with QEMU support for cross-compilation
    # darwin and windows builds disabled - will re-enable when CGO cross-compilation is properly configured

# No archives - output just binary files

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
