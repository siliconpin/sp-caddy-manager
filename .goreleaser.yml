version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    # Remove static linking flags to create dynamically linked binaries
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    flags:
      - -buildmode=default
    # Note: Only Linux amd64 builds enabled - ARM64 disabled due to CGO cross-compilation issues
    # ARM64 builds need proper CGO cross-compilation setup - will re-enable later

archives:
  - format: binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    # This creates individual binary files without version in name

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
