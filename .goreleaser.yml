version: 2

project_name: sp-caddy-manager

before:
  hooks:
    - go mod tidy

builds:
  - id: sp-caddy-manager
    main: .
    binary: sp-caddy-manager
    env:
      - CGO_ENABLED=0
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - license.txt
      - install-sp-caddy-manager.sh
      - src: html
        dst: html

nfpms:
  - id: linux-packages
    package_name: sp-caddy-manager
    vendor: SiliconPin
    homepage: https://siliconpin.com
    maintainer: SiliconPin <support@siliconpin.com>
    description: Caddy server manager.
    license: See license.txt
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: ./html
        dst: /usr/local/share/sp-caddy-manager/html
      - src: ./install-sp-caddy-manager.sh
        dst: /usr/local/share/sp-caddy-manager/install-sp-caddy-manager.sh
      - src: ./README.md
        dst: /usr/local/share/doc/sp-caddy-manager/README.md
      - src: ./CHANGELOG.md
        dst: /usr/local/share/doc/sp-caddy-manager/CHANGELOG.md
      - src: ./license.txt
        dst: /usr/local/share/doc/sp-caddy-manager/license.txt

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  name_template: "sp-caddy-manager {{ .Tag }}"
