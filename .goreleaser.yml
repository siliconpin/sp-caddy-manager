version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -linkmode=external
    # Enables dynamic linking; requires libc on target system

archives:
  - format: binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    # This creates individual binary files without version in name

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github: