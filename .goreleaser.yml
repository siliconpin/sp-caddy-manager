version: 2
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

snapshot:
  version_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
