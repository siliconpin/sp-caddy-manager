version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=0

archives:
  - format: binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github: