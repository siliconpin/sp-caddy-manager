version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    # Remove static linking flags to create dynamically linked binaries
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # Note: Linux amd64 and arm64 builds enabled - ARM64 may have CGO issues in CI

archives:
  - format: binary
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    # This creates individual binary files without version in name

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
