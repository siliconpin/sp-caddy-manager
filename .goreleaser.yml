version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    ldflags: -s -w
    goos:
      - linux
    goarch:
      - amd64
    # Note: Only Linux amd64 build enabled due to sqlite3 CGO compilation issues on cross-platform builds
    # darwin and windows builds disabled - will re-enable when CGO cross-compilation is properly configured

archives:
  - id: tar_gz
    builds:
      - sp-caddy-manager
    format: tar.gz
    files:
      - README.md
      - LICENSE

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
