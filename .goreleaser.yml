version: 1
project_name: sp-caddy-manager

builds:
  - main: .
    binary: sp-caddy-manager
    ldflags: -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      # arm64
    # Note: arm64 builds disabled due to sqlite3 CGO compilation issues on darwin_arm64
    # Will re-enable when CGO cross-compilation is properly configured

archives:
  - id: tar_gz
    builds:
      - sp-caddy-manager
    format: tar.gz
    files:
      - README.md
      - LICENSE
  - id: zip_windows
    builds:
      - sp-caddy-manager
    format: zip
    files:
      - README.md
      - LICENSE

snapshot:
  name_template: "v{{ .Version }}-snapshot"

changelog:
  use: git

release:
  github:
