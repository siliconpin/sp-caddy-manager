<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SP Caddy Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f7fb; color: #202124; }
    header { background: #1f2937; color: #fff; padding: 20px; }
    main { padding: 20px; max-width: 980px; margin: 0 auto; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    h1, h2 { margin-top: 0; }
    form { display: grid; gap: 12px; }
    input, button { font-size: 15px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { background: #2563eb; color: #fff; cursor: pointer; border: none; }
    button:hover { background: #1d4ed8; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .status { font-family: monospace; white-space: pre-wrap; background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .list-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-top: 14px; }
    .list-panel { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .list-panel h3 { margin: 0; padding: 12px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 16px; }
    .list-panel .status { border: 0; border-radius: 0; min-height: 90px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    th { background: #eff6ff; }
  </style>
</head>
<body>
  <header>
    <h1>SP Caddy Manager</h1>
    <p>Use this UI to test APIs and view domains/ports stored in SQLite.</p>
  </header>
  <main>
    <section>
      <h2>Add Domain</h2>
      <form id="addForm">
        <label>
          Domain
          <input type="text" id="addDomain" placeholder="example.com" required />
        </label>
        <label>
          Port
          <input type="number" id="addPort" placeholder="8080" required />
        </label>
        <button type="submit">Add Domain</button>
      </form>
      <div id="addResult" class="status">Ready to add.</div>
    </section>

    <section>
      <h2>Delete Domain</h2>
      <form id="deleteForm">
        <label>
          Domain
          <input type="text" id="deleteDomain" placeholder="example.com" required />
        </label>
        <button type="submit">Delete Domain</button>
      </form>
      <div id="deleteResult" class="status">Ready to delete.</div>
    </section>

    <section>
      <h2>Domain / Port Entries</h2>
      <button id="refreshDomains">Refresh list</button>
      <div class="list-grid">
        <div class="list-panel">
          <h3>Entries from DB</h3>
          <div id="dbDomainsList" class="status">Loading...</div>
        </div>
        <div class="list-panel">
          <h3>Entries from Caddy</h3>
          <div id="caddyDomainsList" class="status">Loading...</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const addForm = document.getElementById('addForm');
    const deleteForm = document.getElementById('deleteForm');
    const addResult = document.getElementById('addResult');
    const deleteResult = document.getElementById('deleteResult');
    const refreshButton = document.getElementById('refreshDomains');
    const dbDomainsList = document.getElementById('dbDomainsList');
    const caddyDomainsList = document.getElementById('caddyDomainsList');

    const show = (el, text) => { el.textContent = text; };
    const escapeHtml = value => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const request = async body => {
      const resp = await fetch('/manage-domain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const text = await resp.text();
      return { ok: resp.ok, status: resp.status, text };
    };

    const requestJSON = async body => {
      const resp = await fetch('/manage-domain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`ERROR ${resp.status}: ${text}`);
      }
      return resp.json();
    };

    const renderDomainTable = (el, data, emptyText) => {
      if (!data.length) {
        el.textContent = emptyText;
        return;
      }

      const rows = data
        .map(item => `<tr><td>${escapeHtml(item.domain)}</td><td>${escapeHtml(item.port || '')}</td></tr>`)
        .join('');
      el.innerHTML = `<table><thead><tr><th>Domain</th><th>Port</th></tr></thead><tbody>${rows}</tbody></table>`;
    };

    const refreshDomains = async () => {
      dbDomainsList.textContent = 'Loading...';
      caddyDomainsList.textContent = 'Loading...';
      try {
        const [dbData, caddyData] = await Promise.all([
          requestJSON({ action: 'list-db' }),
          requestJSON({ action: 'list-caddy' })
        ]);

        renderDomainTable(dbDomainsList, dbData, 'No DB entries.');
        renderDomainTable(caddyDomainsList, caddyData, 'No Caddy entries.');
      } catch (err) {
        dbDomainsList.textContent = err.message;
        caddyDomainsList.textContent = err.message;
      }
    };

    addForm.addEventListener('submit', async event => {
      event.preventDefault();
      const domain = document.getElementById('addDomain').value.trim();
      const port = Number(document.getElementById('addPort').value.trim());
      if (!domain || !port) {
        show(addResult, 'Domain and port are required.');
        return;
      }
      const resp = await request({ action: 'add', domain, port });
      show(addResult, resp.ok ? resp.text : `ERROR ${resp.status}: ${resp.text}`);
      if (resp.ok) refreshDomains();
    });

    deleteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const domain = document.getElementById('deleteDomain').value.trim();
      if (!domain) {
        show(deleteResult, 'Domain is required.');
        return;
      }
      const resp = await request({ action: 'delete', domain });
      show(deleteResult, resp.ok ? resp.text : `ERROR ${resp.status}: ${resp.text}`);
      if (resp.ok) refreshDomains();
    });

    refreshButton.addEventListener('click', refreshDomains);
    window.addEventListener('load', refreshDomains);
  </script>
</body>
</html>
